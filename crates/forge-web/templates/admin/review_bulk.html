<form method="post" class="admin-actions" action="/admin/review/{{ bulk_slug }}/skip">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="bulk-{{ bulk_slug }}"><span data-i18n="admin_bulk_note">Note for all its versions (needed to verify flagged ones; the reason to block)</span></label>
  <input id="bulk-{{ bulk_slug }}" name="note">
  <button type="submit" formaction="/admin/review/{{ bulk_slug }}/verify"><span data-i18n="admin_verify_all">Verify all</span></button>
  <button type="submit" class="secondary"><span data-i18n="admin_skip_all">Skip all</span></button>
  <button type="submit" class="danger" formaction="/admin/review/{{ bulk_slug }}/block"><span data-i18n="admin_block_all">Block all</span></button>
</form>
