{% extends "base.html" %}
{% block title %}{{ title }} - Admin - SurvivorsForge{% endblock %}
{% block content %}
<p><a href="/admin">Admin</a></p>
<h1>{{ title }}</h1>
{% include "admin/flash.html" %}
<form class="panel admin-actions" method="post" action="/admin/list/{{ kind }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="new-name">New entry</label><input id="new-name" name="name" required>
  <label for="new-sort">Order (lower comes first)</label><input id="new-sort" name="sort_key" inputmode="numeric" required>
  <button type="submit">Add</button>
</form>
<section class="panel">
  {% if rows.is_empty() %}<p class="muted">Empty.</p>{% endif %}
  {% for (key, name, sort) in rows %}
  <div class="member">
    <form method="post" action="/admin/list/{{ kind }}/{{ key }}/save">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label class="sr-only" for="name-{{ loop.index }}">Name</label><input id="name-{{ loop.index }}" name="name" value="{{ name }}">
      <label class="sr-only" for="sort-{{ loop.index }}">Order</label><input id="sort-{{ loop.index }}" name="sort_key" value="{{ sort }}" inputmode="numeric" class="narrow">
      <button type="submit" class="secondary">Save</button>
    </form>
    <form method="post" action="/admin/list/{{ kind }}/{{ key }}/delete" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="danger">Delete</button>
    </form>
  </div>
  {% endfor %}
</section>
{% endblock %}
