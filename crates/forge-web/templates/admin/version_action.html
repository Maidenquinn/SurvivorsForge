<form method="post" action="/admin/versions/{{ v.id }}/{{ action }}" class="inline-action">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="back" value="/admin/addons/{{ slug }}">
  <label class="sr-only" for="{{ action }}-{{ v.id }}"><span data-i18n="admin_note">Note</span> : <span data-i18n-enum="admin_version_action" data-i18n-value="{{ action }}">{{ label }}</span> {{ v.tag }}</label>
  <input id="{{ action }}-{{ v.id }}" name="note" placeholder="Note" data-i18n-placeholder="admin_note" {% if action != "verify" || v.trust == "flagged" %}required{% endif %}>
  <button type="submit" class="{{ class }}" data-i18n-enum="admin_version_action" data-i18n-value="{{ action }}">{{ label }}</button>
</form>
