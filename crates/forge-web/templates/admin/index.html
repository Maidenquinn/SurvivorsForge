{% extends "base.html" %}
{% block title %}Admin - SurvivorsForge{% endblock %}
{% block content %}
<h1><span data-i18n="admin">Admin</span></h1>
<form class="panel admin-actions" method="get" action="/admin/addons" role="search">
  <label for="q"><span data-i18n="admin_manage_addon">Manage an addon: versions, verification, owner, block</span></label>
  <input id="q" type="search" name="q" placeholder="Name" data-i18n-placeholder="name">
  <button type="submit"><span data-i18n="action_find">Find</span></button>
</form>
<div class="grid">
  <a class="panel tile" href="/admin/review"><strong>{{ queue }}</strong> <span data-i18n="admin_versions_to_review">versions to review</span></a>
  <a class="panel tile" href="/admin/comment-reports"><span data-i18n="admin_comment_reports">Comment reports</span></a>
  <a class="panel tile" href="/admin/reports"><strong>{{ reports }}</strong> <span data-i18n="admin_open_reports_count">open reports</span></a>
  <a class="panel tile" href="/admin/users"><span data-i18n="admin_users_bans">Users and bans</span></a>
  <a class="panel tile" href="/admin/addons/new"><span data-i18n="admin_add_other">Add an addon of someone else</span></a>
  <a class="panel tile" href="/admin/list/game-versions"><span data-i18n="admin_game_versions">Game versions</span></a>
  <a class="panel tile" href="/admin/list/categories"><span data-i18n="admin_categories">Categories</span></a>
  <a class="panel tile" href="/admin/audit"><span data-i18n="admin_audit_log">Audit log</span></a>
</div>
{% endblock %}
