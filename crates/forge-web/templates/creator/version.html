{% extends "base.html" %}
{% block title %}{{ tag }} compatibility - SurvivorsForge{% endblock %}
{% block content %}
<h1><span data-i18n="creator_compatibility_title">Which game versions does this AddOn run on?</span> <code>{{ tag }}</code></h1>
{% include "creator/nav.html" %}
<p><a href="/addons/{{ slug }}/versions" data-i18n="creator_back_versions">Back to versions</a></p>
{% if let Some(e) = error %}<div class="notice bad" role="alert">{{ e }}</div>{% endif %}
<form class="panel" method="post" action="/addons/{{ slug }}/versions/{{ tag }}/edit">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="game_min" data-i18n="creator_from">From</label>
  <select id="game_min" name="game_min">
    <option value="" data-i18n="creator_not_stated">Not stated</option>
    {% for g in games %}<option value="{{ g }}" {% if *g == game_min %}selected{% endif %}>{{ g }}</option>{% endfor %}
  </select>
  <label for="game_max" data-i18n="creator_up_to">Up to (leave empty for "and later")</label>
  <select id="game_max" name="game_max">
    <option value="" data-i18n="creator_and_later">And later</option>
    {% for g in games %}<option value="{{ g }}" {% if *g == game_max %}selected{% endif %}>{{ g }}</option>{% endfor %}
  </select>
  <p><button type="submit" data-i18n="action_save">Save</button></p>
</form>
{% endblock %}
