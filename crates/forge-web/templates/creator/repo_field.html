<div id="repo-field">
  <label for="repo_name">GitHub repo</label>
  <div class="repo-input">
    {% if repo.editable %}<input name="repo_owner" value="{{ repo.owner }}" aria-label="Account" placeholder="account" required autocomplete="off"
      hx-get="/addons/new/repos" hx-trigger="input changed delay:300ms" hx-target="#repo-suggestions" hx-include="#repo-field">
    {% else %}<span class="repo-owner">{{ repo.owner }}</span>{% endif %}
    <span class="repo-slash">/</span>
    <input id="repo_name" name="repo_name" value="{{ repo.name }}" placeholder="repo name" required autocomplete="off"
      hx-get="/addons/new/repos" hx-trigger="input changed delay:300ms, focus once" hx-target="#repo-suggestions" hx-include="#repo-field">
    <input type="hidden" name="page" value="{{ repo.page }}">
  </div>
  <div id="repo-suggestions" class="suggestions">{% include "creator/repo_suggestions.html" %}</div>
  {% if repo.picked %}<p><a class="button secondary" href="{% if repo.page == "admin" %}/admin{% endif %}/addons/new?repo={{ repo.owner }}/{{ repo.name }}">Fill in from this repo</a></p>{% endif %}
</div>
