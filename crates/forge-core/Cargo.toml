[package]
name = "forge-core"
version = "0.1.0"
edition = "2024"
description = "Shared addon logic of SurvivorsForge: zip analysis, .toc parsing, registry types"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ammonia = "4.2.4"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
