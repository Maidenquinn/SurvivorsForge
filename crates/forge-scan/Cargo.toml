[package]
name = "forge-scan"
version = "0.1.0"
edition = "2024"
description = "Static security scanner for Azeroth Survivors addon zips"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
