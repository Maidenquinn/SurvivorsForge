# SurvivorsForge platform. Values come from `.env` (see `.env.example`). This file and `.env` are
# all a server needs: the images come from ghcr.io, Caddy's configuration is below.
#
#   docker compose up -d                        everything
#   docker compose up -d postgres api worker    the API alone, without website and proxy
#   docker compose pull && docker compose up -d update to the newest release
#
# FORGE_VERSION pins a release (e.g. 0.3.2); without it `latest` runs. To build the images from
# this repository instead, add compose.local.yaml (docs/local-setup.md). For local development,
# compose.dev.yaml publishes Postgres on 127.0.0.1.

x-api: &api
  image: ghcr.io/rezondes/survivorsforge-api:${FORGE_VERSION:-latest}
  env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
    IMAGE_DIR: /data/images
    GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
    # Fixed addresses of Caddy and the website on the edge network; their X-Forwarded-For is trusted.
    TRUSTED_PROXIES: ${FORGE_CADDY_IP:-10.213.17.10},${FORGE_WEB_IP:-10.213.17.11}
  secrets:
    - github-app.pem
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *api
    command: ["serve"]
    volumes:
      - images:/data/images
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-api", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *api
    command: ["worker"]
    # The API applies the migrations; the worker starts once they are in.
    depends_on:
      api:
        condition: service_healthy
    # Handles untrusted zips: no image volume, read-only file system, capped memory.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    # Builds addon packs; the only volume it writes.
    volumes:
      - packs:/data/packs
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-api", "healthcheck", "db"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/rezondes/survivorsforge-web:${FORGE_VERSION:-latest}
    env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
    environment:
      API_INTERNAL_URL: http://api:8080
      TRUSTED_PROXIES: ${FORGE_CADDY_IP:-10.213.17.10}
    networks:
      edge:
        # Fixed, so the API can trust the client IP the website forwards.
        ipv4_address: ${FORGE_WEB_IP:-10.213.17.11}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/forge-web", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
    - path: ${FORGE_ENV_FILE:-.env}
      required: false
    # Plain HTTP: the website on 3080, the API on 3081 (the ports in DOMAIN_WEB and DOMAIN_API).
    # TLS ends in front of the server, e.g. at Cloudflare.
    ports:
      - "3080:3080"
      - "3081:3081"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - images:/srv/img:ro
      - packs:/srv/packs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${FORGE_CADDY_IP:-10.213.17.10}
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  # Postgres lives here only; nothing on it can reach the internet.
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${FORGE_EDGE_SUBNET:-10.213.17.0/24}

volumes:
  postgres:
  images:
  packs:
  caddy-data:
  caddy-config:

# Caddy reads DOMAIN_WEB, DOMAIN_API and ACME_EMAIL from its environment (`$$` keeps Compose off them).
configs:
  caddyfile:
    content: |
      {
        email {$$ACME_EMAIL}
      }

      {$$DOMAIN_WEB} {
        # Uploaded images straight from the volume; nothing outside /img/ is ever served from it.
        handle_path /img/* {
          root * /srv/img
          header Cache-Control "public, max-age=31536000, immutable"
          header X-Content-Type-Options nosniff
          file_server
        }
        # Built addon packs; the name is the SHA-256 of the pack's versions, so the file never changes.
        handle_path /packs-files/* {
          root * /srv/packs
          header Cache-Control "public, max-age=86400"
          header X-Content-Type-Options nosniff
          header Content-Disposition "attachment; filename=\"SurvivorsForge-pack.zip\""
          file_server
        }
        handle {
          reverse_proxy web:8080
        }
      }

      {$$DOMAIN_API} {
        reverse_proxy api:8080
      }

secrets:
  github-app.pem:
    file: ${GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github-app.pem}
