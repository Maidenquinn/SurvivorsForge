name: Release

on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        id: check
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Asset names are what the self-update looks for, see src/self_update.rs.
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/SurvivorsForge.exe -DestinationPath "SurvivorsForge-${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SurvivorsForge-*.zip

  linux:
    needs: version
    # Oldest glibc we support (2.35), so the AppImage runs on SteamOS and current distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package AppImage
        run: bash packaging/linux/build-appimage.sh target/release/SurvivorsForge "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/SurvivorsForge-*.AppImage

  # The platform images that compose.yaml pulls. Pushed once both launcher builds succeeded, so
  # `latest` never points at a version without a release.
  images:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/survivorsforge-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/forge-${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Runs only when both builds and the images succeeded, so a release never ships with a part missing.
  publish:
    needs: [version, windows, linux, images]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # What a server needs besides the images (docs/self-hosting.md).
      - name: Add the server files
        run: cp compose.yaml assets/ && cp .env.example assets/env.example
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SurvivorsForge ${{ needs.version.outputs.version }}" \
            --generate-notes
